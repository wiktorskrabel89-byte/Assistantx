<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>Jarvis OS — Loading</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --neon-local: #7dd3fc;
      --neon-cloud: #a78bfa;
      --bg: #06070d;
      --text: #e8eaf0;
      --text-dim: #6b7a99;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    /* Premium mesh gradient background */
    @keyframes mesh-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -50px) scale(1.08); }
      66%      { transform: translate(-30px, 30px) scale(0.96); }
    }
    @keyframes mesh-drift-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-60px, 40px) scale(1.05); }
    }
    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(40px);
    }
    body::before {
      top: -25vh; left: -20vw;
      width: 80vh; height: 80vh;
      background: radial-gradient(circle, rgba(125,211,252,0.22) 0%, rgba(99,102,241,0.10) 40%, transparent 70%);
      animation: mesh-drift 24s ease-in-out infinite;
    }
    body::after {
      bottom: -25vh; right: -20vw;
      width: 70vh; height: 70vh;
      background: radial-gradient(circle, rgba(167,139,250,0.22) 0%, rgba(244,114,182,0.08) 45%, transparent 70%);
      animation: mesh-drift-2 28s ease-in-out infinite;
    }

    /* drag region */
    #titlebar { -webkit-app-region: drag; height: 32px; }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 32px);
      gap: 32px;
      padding: 24px;
    }

    .splash-shell {
      width: min(540px, 100%);
      padding: 32px;
      border-radius: 28px;
      border: 1px solid rgba(129,140,248,0.18);
      background: linear-gradient(160deg, rgba(20,22,40,0.55) 0%, rgba(10,12,24,0.88) 100%);
      box-shadow: 0 32px 96px rgba(0,0,0,0.55), 0 0 80px rgba(99,102,241,0.10), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 44px;
      animation: pulse 2.5s ease-in-out infinite;
      filter: drop-shadow(0 4px 24px rgba(99,102,241,0.55));
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(0.96); }
    }

    .title-area { text-align: center; }
    .title-area h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e8f0ff;
    }
    .title-area p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ── progress bars ───────────────────────────────────────────────────────── */
    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 380px;
    }

    .progress-item {}
    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .progress-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }
    .progress-pct {
      font-size: 12px;
      color: var(--text-dim);
    }

    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 20px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .fill-local { background: linear-gradient(90deg, #007b64, var(--neon-local)); }
    .fill-cloud { background: linear-gradient(90deg, #5b21b6, var(--neon-cloud)); }

    /* ── status lines ────────────────────────────────────────────────────────── */
    .status-line {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      min-height: 16px;
    }

    .status-card {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      padding: 14px 16px;
      display: grid;
      gap: 10px;
    }

    .status-card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-card-title {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }

    .status-pill {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0,255,213,0.12);
      color: var(--neon-local);
      border: 1px solid rgba(0,255,213,0.2);
    }

    .status-note {
      color: #9bb0d3;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ── error card ──────────────────────────────────────────────────────────── */
    #error-card {
      display: none;
      padding: 14px 18px;
      border: 1px solid rgba(255,80,80,0.35);
      background: rgba(255,80,80,0.07);
      border-radius: 10px;
      font-size: 12.5px;
      color: #ff8080;
      max-width: 380px;
      text-align: center;
    }

    /* ── skip button ─────────────────────────────────────────────────────────── */
    #skip-button {
      display: none;
      margin-top: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(125,211,252,0.32);
      background: rgba(125,211,252,0.08);
      color: var(--neon-local);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #skip-button:hover {
      transform: translateY(-1px);
      background: rgba(125,211,252,0.18);
    }
    #skip-button.visible { display: inline-flex; }

    /* ── cloud fast-start ────────────────────────────────────────────────────── */
    #cloud-check {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(168,85,247,0.2);
      border-top-color: var(--neon-cloud);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="titlebar"></div>
  <div class="container">
    <div class="splash-shell">
      <div class="logo">🤖</div>

      <div class="title-area">
        <h1 id="splash-title">Starting Jarvis OS…</h1>
        <p id="splash-subtitle">Preparing your AI runtime</p>
      </div>

      <div class="status-card">
        <div class="status-card-header">
          <span class="status-card-title">Local startup pipeline</span>
          <span class="status-pill" id="voice-status-pill">Initializing</span>
        </div>
        <div class="status-note" id="status-line">Initializing…</div>
      </div>

      <!-- LOCAL mode: two download bars ────────────────────────────────────── -->
      <div class="progress-list" id="local-progress" style="display:none">
        <div class="progress-item">
          <div class="progress-header">
            <span class="progress-label">🧠 LLM MODEL (Ollama)</span>
            <span class="progress-pct" id="llm-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill fill-local" id="llm-bar"></div>
          </div>
        </div>
        <div class="progress-item">
          <div class="progress-header">
            <span class="progress-label">🎙️ WHISPER + KOKORO</span>
            <span class="progress-pct" id="py-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill fill-local" id="py-bar"></div>
          </div>
        </div>
        <div class="progress-item" id="deps-progress-wrap" style="display:none">
          <div class="progress-header">
            <span class="progress-label">📦 PYTHON DEPENDENCIES</span>
            <span class="progress-pct" id="deps-pct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill fill-local" id="deps-bar"></div>
          </div>
        </div>
      </div>

      <!-- CLOUD mode: spinner ───────────────────────────────────────────────── -->
      <div id="cloud-check">
        <div class="spinner"></div>
      </div>

      <div class="status-card">
        <div class="status-card-header">
          <span class="status-card-title">App updates</span>
          <span class="status-pill" id="update-status-pill" style="background:rgba(168,85,247,0.12);color:var(--neon-cloud);border-color:rgba(168,85,247,0.24);">Waiting</span>
        </div>
        <div class="status-note" id="updater-status-line">Updater: waiting to check…</div>
        <div class="progress-list" style="max-width:none">
          <div class="progress-item" id="updater-progress-wrap" style="display:none">
            <div class="progress-header">
              <span class="progress-label">⬆️ APP UPDATE</span>
              <span class="progress-pct" id="updater-pct">0%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill fill-cloud" id="updater-bar"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="error-card"></div>

      <button id="skip-button" type="button">Skip and continue to app →</button>
    </div>

  </div>

  <script>
    function setStatus(text) {
      document.getElementById('status-line').textContent = text;
      const pill = document.getElementById('voice-status-pill');
      if (pill) pill.textContent = text && text.length > 24 ? 'Working…' : (text || 'Initializing');
    }

    function setLlmProgress(pct) {
      const p = Math.min(100, Math.max(0, pct));
      document.getElementById('llm-bar').style.width = p + '%';
      document.getElementById('llm-pct').textContent = Math.round(p) + '%';
    }

    function setPyProgress(pct) {
      const p = Math.min(100, Math.max(0, pct));
      document.getElementById('py-bar').style.width = p + '%';
      document.getElementById('py-pct').textContent = Math.round(p) + '%';
    }

    function setDepsProgress(pct) {
      const p = Math.min(100, Math.max(0, pct));
      const wrap = document.getElementById('deps-progress-wrap');
      if (wrap && p > 0) wrap.style.display = 'block';
      document.getElementById('deps-bar').style.width = p + '%';
      document.getElementById('deps-pct').textContent = Math.round(p) + '%';
    }

    function showError(msg) {
      const card = document.getElementById('error-card');
      card.textContent = '⚠️ ' + msg;
      card.style.display = 'block';
    }

    function setUpdaterStatus(text) {
      document.getElementById('updater-status-line').textContent = text;
      const pill = document.getElementById('update-status-pill');
      if (!pill) return;
      if (/download/i.test(text || '')) {
        pill.textContent = 'Downloading';
      } else if (/ready|date/i.test(text || '')) {
        pill.textContent = 'Ready';
      } else if (/error|unavailable/i.test(text || '')) {
        pill.textContent = 'Skipped';
      } else if (/check/i.test(text || '')) {
        pill.textContent = 'Checking';
      } else {
        pill.textContent = 'Waiting';
      }
    }

    function setUpdaterProgress(pct) {
      const p = Math.min(100, Math.max(0, Number(pct || 0)));
      const wrap = document.getElementById('updater-progress-wrap');
      if (wrap) wrap.style.display = 'block';
      document.getElementById('updater-bar').style.width = p + '%';
      document.getElementById('updater-pct').textContent = Math.round(p) + '%';
    }

    function hideUpdaterProgress() {
      const wrap = document.getElementById('updater-progress-wrap');
      if (wrap) wrap.style.display = 'none';
    }

    function applyUpdaterState(payload) {
      const status = String(payload?.status || 'idle').toLowerCase();
      if (status === 'checking') {
        hideUpdaterProgress();
        setUpdaterStatus('Updater: checking for updates…');
        return;
      }
      if (status === 'available') {
        hideUpdaterProgress();
        setUpdaterStatus('Updater: update found, downloading in background…');
        return;
      }
      if (status === 'downloading') {
        setUpdaterProgress(payload?.downloadProgress || 0);
        setUpdaterStatus('Updater: downloading update in background…');
        return;
      }
      if (status === 'install-ready') {
        setUpdaterProgress(100);
        setUpdaterStatus('Updater: update ready, will install on app close.');
        return;
      }
      if (status === 'error' || status === 'unavailable') {
        hideUpdaterProgress();
        setUpdaterStatus('Updater: check unavailable, continuing startup.');
        return;
      }
      if (status === 'up-to-date') {
        hideUpdaterProgress();
        setUpdaterStatus('Updater: app is up to date.');
      }
    }

    // ── Skip button: shown after 6s, lets user bypass slow setup ─────────────
    // The launcher waits up to 10 min on first run for ML model downloads, so
    // the Skip button is the user's escape hatch when anything along the way
    // hangs (network down, Python missing, Ollama not installed).
    const skipBtn = document.getElementById('skip-button');
    let skipTimer = null;
    function showSkipButton() {
      if (skipBtn) skipBtn.classList.add('visible');
    }
    function startSkipCountdown() {
      if (skipTimer) return;
      skipTimer = setTimeout(showSkipButton, 6000);
    }
    if (skipBtn) {
      skipBtn.addEventListener('click', () => {
        skipBtn.disabled = true;
        skipBtn.textContent = 'Launching…';
        if (window.jarvisIpc?.invoke) {
          window.jarvisIpc.invoke('splash:skip').catch(() => {});
        }
      });
    }
    startSkipCountdown();

    // ── IPC listeners (set up before main process sends events) ──────────────
    if (window.jarvisIpc?.on) {
      window.jarvisIpc.on('splash:progress', (data) => {
        if (!data) return;
        if (data.llmPercent !== undefined) setLlmProgress(data.llmPercent);
        if (data.pyPercent  !== undefined) setPyProgress(data.pyPercent);
        if (data.depsPercent !== undefined) setDepsProgress(data.depsPercent);
        if (data.status)   setStatus(data.status);
        if (data.error)    {
          showError(data.error);
          showSkipButton();  // On error, let user proceed anyway
        }
      });
      window.jarvisIpc.on('auto-update-status', (payload) => {
        if (!payload) return;
        applyUpdaterState(payload);
      });
    }

    // ── boot: ask main process for splash mode ────────────────────────────────
    async function init() {
      let mode = 'local';
      try {
        if (window.jarvisIpc?.invoke) {
          const cfg = await window.jarvisIpc.invoke('config:get-engine-mode');
          mode = cfg?.engine_mode || 'local';
        }
      } catch { /* ignore */ }

      if (mode === 'cloud' || mode === 'byok-cloud') {
        document.getElementById('splash-title').textContent = 'Connecting to Cloud Matrix…';
        document.getElementById('splash-subtitle').textContent = 'Verifying subscription status';
        document.getElementById('cloud-check').style.display = 'flex';
        setStatus('Checking network and credentials…');
      } else {
        document.getElementById('local-progress').style.display = 'flex';
        setStatus('Checking for AI models…');
      }
    }

    init();
  </script>
</body>
</html>
