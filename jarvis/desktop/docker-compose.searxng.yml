services:
  searxng:
    image: searxng/searxng:latest
    container_name: assistantx-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - BASE_URL=http://127.0.0.1:8888/
      - INSTANCE_NAME=AssistantX Local Search
    volumes:
      - searxng_data:/etc/searxng

volumes:
  searxng_data:

