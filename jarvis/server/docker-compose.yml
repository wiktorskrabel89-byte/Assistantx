version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ${HOME}/jarvis-server/ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: jarvis-search
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/jarvis-server/searxng:/etc/searxng
    restart: unless-stopped

  netdata:
    image: netdata/netdata:stable
    container_name: jarvis-monitor
    ports:
      - "19999:19999"
    volumes:
      - netdatacache:/var/cache/netdata
      - netdatalib:/var/lib/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    restart: unless-stopped

  jarvis-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jarvis-agent
    env_file:
      - ${HOME}/jarvis-server/.env.server
    environment:
      - JARVIS_SYNC_KEY_FILE=/srv/jarvis/.sync-key
      - JARVIS_PAIR_CONSUMED_FILE=/srv/jarvis/.pair-key-consumed
      - JARVIS_ALLOWED_DIRECTORY=${JARVIS_ALLOWED_DIRECTORY}
      - JARVIS_AGENT_STATE_DIR=/srv/jarvis/agent_state
      - JARVIS_LOG_DIR=/srv/jarvis/logs
      - JARVIS_NETDATA_URL=${JARVIS_NETDATA_URL}
      - JARVIS_AGENT_WS_HOST=${JARVIS_AGENT_WS_HOST}
      - JARVIS_AGENT_WS_PORT=${JARVIS_AGENT_WS_PORT}
      - JARVIS_PAIR_BIND_HOST=${JARVIS_PAIR_BIND_HOST}
      - JARVIS_PAIR_HTTP_PORT=${JARVIS_PAIR_HTTP_PORT}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${HOME}/jarvis-server:/srv/jarvis
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  netdatacache:
  netdatalib:
