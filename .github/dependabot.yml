version: 2
updates:
  # Root Next.js app
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - "dependencies"
      - "npm"
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      supabase:
        patterns:
          - "@supabase/*"
      ai-sdks:
        patterns:
          - "openai"
          - "@anthropic-ai/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tw-animate-css"
      testing:
        patterns:
          - "jest"
          - "jest-*"
          - "@types/jest"
          - "@testing-library/*"
          - "@playwright/test"
          - "playwright"
      radix:
        patterns:
          - "radix-ui"
          - "@radix-ui/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"

  # Jarvis Desktop (Electron)
  - package-ecosystem: "npm"
    directory: "/jarvis/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - "dependencies"
      - "npm"
      - "jarvis-desktop"
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-*"

  # Jarvis Android (React Native)
  - package-ecosystem: "npm"
    directory: "/jarvis/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - "dependencies"
      - "npm"
      - "jarvis-android"
    groups:
      react-native:
        patterns:
          - "react"
          - "react-native"
          - "@react-native*"

  # Python FastAPI backend
  - package-ecosystem: "pip"
    directory: "/ai agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      langchain:
        patterns:
          - "langchain*"
      ai-providers:
        patterns:
          - "openai"
          - "anthropic"
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker — root Next.js image (node:22-bookworm-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"

  # Docker — AI agent image (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/ai agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
