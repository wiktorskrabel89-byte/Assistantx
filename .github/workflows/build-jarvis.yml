name: Build Jarvis Desktop

on:
  # Trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.0). Leave blank to publish to jarvis-latest."
        required: false
        type: string
  # Auto-trigger when jarvis changes land on main, or when a versioned tag is pushed
  push:
    branches:
      - main
    paths:
      - 'jarvis/**'
    tags:
      - 'v*'

jobs:
  build:
    name: Build Jarvis EXE (Windows)
    runs-on: windows-latest

    # Minimal permissions: read code + write releases
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPDATE_ROLLOUT_PERCENTAGE: '100'
      UPDATES_BASE_URL: 'https://updates.assistantx.pl'
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jarvis-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so we can generate a meaningful changelog
          fetch-depth: 0

      - name: Advance jarvis-latest tag and remove legacy releases
        shell: pwsh
        if: env.RELEASE_TAG == 'jarvis-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repoUrl = "https://api.github.com/repos/${{ github.repository }}"

          # Force-move the jarvis-latest tag to the current commit
          try {
            Invoke-RestMethod -Method Patch -Headers $headers `
              -Uri "$repoUrl/git/refs/tags/jarvis-latest" `
              -Body (@{ sha = "${{ github.sha }}"; force = $true } | ConvertTo-Json) | Out-Null
            Write-Host "Moved jarvis-latest tag to ${{ github.sha }}"
          } catch {
            Write-Host "jarvis-latest tag not found yet; it will be created by the release step."
          }

          # One-time cleanup: delete legacy V2 and Jarvis-Latest releases and their tags
          foreach ($oldTag in @("V2", "Jarvis-Latest")) {
            try {
              $rel = Invoke-RestMethod -Method Get -Headers $headers -Uri "$repoUrl/releases/tags/$oldTag" -ErrorAction Stop
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$repoUrl/releases/$($rel.id)" -ErrorAction Stop
              Write-Host "Deleted release: $oldTag (id=$($rel.id))"
            } catch { Write-Host "Release '$oldTag' not found or already removed." }
            try {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$repoUrl/git/refs/tags/$oldTag" -ErrorAction Stop
              Write-Host "Deleted tag: $oldTag"
            } catch { Write-Host "Tag '$oldTag' not found or already removed." }
          }

      - name: Bump version and generate changelog
        id: meta
        shell: pwsh
        run: |
          $releaseTag = "${{ env.RELEASE_TAG }}".Trim()
          $desktopPkg = Get-Content "jarvis/desktop/package.json" -Raw | ConvertFrom-Json
          if ($releaseTag -eq 'jarvis-latest') {
            # Rolling latest: always generate a unique newer patch version.
            $baseVersion = [string]$desktopPkg.version
            if ($baseVersion -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:[-+][0-9A-Za-z.-]+)?$') {
              Write-Error "Invalid desktop package version '$baseVersion'. Expected semver."
              exit 1
            }
            $major = [int]$Matches['major']
            $minor = [int]$Matches['minor']
            $basePatch = [int]$Matches['patch']
            $runIncrement = [Math]::Max([int]"${{ github.run_number }}", 1)
            $patch = $basePatch + $runIncrement
            $version = "$major.$minor.$patch"
            Write-Host "Rolling build — version generated from run number: $version"
          } elseif ($releaseTag -notmatch '^[vV](\d+)(?:\.(\d+))?(?:\.(\d+))?([+-][0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag '$releaseTag'. Expected format like v1.1.0, v2, or V2."
            exit 1
          } else {
            $major = $Matches[1]
            $minor = if ([string]::IsNullOrWhiteSpace($Matches[2])) { '0' } else { $Matches[2] }
            $patch = if ([string]::IsNullOrWhiteSpace($Matches[3])) { '0' } else { $Matches[3] }
            $suffix = if ([string]::IsNullOrWhiteSpace($Matches[4])) { '' } else { $Matches[4] }
            $version = "$major.$minor.$patch$suffix"
            Write-Host "Version: $version"
          }
          # Patch desktop package.json
          # Patch desktop package.json
          $desktopPkg.version = $version
          $desktopPkg | ConvertTo-Json -Depth 20 | Set-Content "jarvis/desktop/package.json" -Encoding UTF8

          # Patch android package.json
          $androidPkg = Get-Content "jarvis/android/package.json" -Raw | ConvertFrom-Json
          $androidPkg.version = $version
          $androidPkg | ConvertTo-Json -Depth 20 | Set-Content "jarvis/android/package.json" -Encoding UTF8

          # Generate segmented, human-readable release notes from recent jarvis/ commits.
          # Redirect stderr to null so git error output never leaks into the release notes.
          $commitsRaw = git log --pretty=format:"%s" -60 -- jarvis/ 2>$null
          $commitLines = @(
            $commitsRaw -split "`n" |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            ForEach-Object {
              $normalized = $_ -replace '^\s*v\d+(?:\.\d+)*(?:[-_\s:]+)?', ''
              $normalized = $normalized -replace '^\s*(release|build)\s*[:\-]?\s*', ''
              $normalized = ($normalized -replace '\s+', ' ').Trim(" -_:;,.")
              if ([string]::IsNullOrWhiteSpace($normalized)) { return }
              $wordCount = ($normalized -split '\s+' | Where-Object { $_ }).Count
              $looksLikeNoise = $normalized -match '^(?:wip|tmp|test|misc|update|fixup!|squash!|dwadawdwa|asdf|qwe)+$'
              if ($wordCount -lt 2 -or $looksLikeNoise) { return }
              $normalized
            }
          )
          if ($commitLines.Count -eq 0) {
            $commitLines = @(
              "Improved Jarvis desktop reliability and startup diagnostics.",
              "Enhanced AI routing and prompt quality for clearer responses.",
              "Strengthened update delivery, installer flow, and release safety checks.",
              "Applied performance, compatibility, and stability fixes across supported platforms."
            )
          }

          $sections = [ordered]@{
            "Core platform and reliability" = @()
            "AI and voice experience" = @()
            "Desktop UX and productivity" = @()
            "Integrations and connectivity" = @()
            "Release engineering and packaging" = @()
          }

          foreach ($line in $commitLines) {
            $target = "Core platform and reliability"
            if ($line -match '(?i)\b(ai|llm|model|prompt|voice|stt|tts|speech|assistant)\b') {
              $target = "AI and voice experience"
            } elseif ($line -match '(?i)\b(ui|ux|renderer|modal|settings|tray|window|desktop|launcher)\b') {
              $target = "Desktop UX and productivity"
            } elseif ($line -match '(?i)\b(api|oauth|github|google|supabase|sync|pair|network|wake|server|bridge|integration)\b') {
              $target = "Integrations and connectivity"
            } elseif ($line -match '(?i)\b(release|updater|installer|build|workflow|ci|publish|dist|packaging)\b') {
              $target = "Release engineering and packaging"
            }
            $sections[$target] += $line
          }

          foreach ($name in @($sections.Keys)) {
            $sections[$name] = @($sections[$name] | Select-Object -Unique | Select-Object -First 8)
          }

          $sectionBlocks = @()
          foreach ($sectionName in $sections.Keys) {
            $items = @($sections[$sectionName])
            if ($items.Count -eq 0) { continue }
            $sectionBlocks += "### $sectionName`n" + (($items | ForEach-Object { "- $_" }) -join "`n")
          }

          if ($sectionBlocks.Count -eq 0) {
            $sectionBlocks = @(
              "### Core platform and reliability`n- Improved stability and startup health checks.",
              "### AI and voice experience`n- Better response quality and voice pipeline consistency.",
              "### Release engineering and packaging`n- Hardened updater flow and artifact validation."
            )
          }

          $notesMarkdown = $sectionBlocks -join "`n`n"
          $highlights = @(
            foreach ($sectionName in $sections.Keys) {
              $items = @($sections[$sectionName])
              if ($items.Count -gt 0) { $items[0] }
            }
          )
          if ($highlights.Count -eq 0) {
            $highlights = @(
              "Improved Jarvis desktop reliability and startup diagnostics.",
              "Enhanced AI routing and prompt quality for clearer responses.",
              "Strengthened update delivery, installer flow, and release safety checks."
            )
          }
          $highlights = @($highlights | Select-Object -First 8)
          $segments = @(
            foreach ($sectionName in $sections.Keys) {
              $items = @($sections[$sectionName])
              if ($items.Count -gt 0) {
                [ordered]@{
                  title = $sectionName
                  items = $items
                }
              }
            }
          )
          if ($segments.Count -eq 0) {
            $segments = @(
              [ordered]@{
                title = "Release highlights"
                items = $highlights
              }
            )
          }

          $sha7 = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date -AsUTC -Format "yyyy-MM-dd HH:mm") + " UTC"
          $publishedAt = (Get-Date -AsUTC).ToString("o")

          $bt = '``'
          $commitUrl = "https://github.com/wiktorskrabel89-byte/Assistantx/commit/${{ github.sha }}"

          $releaseNotes = [ordered]@{
            version = $version
            channel = "stable"
            publishedAt = $publishedAt
            highlights = $highlights
            segments = $segments
            notesMarkdown = $notesMarkdown
            policy = [ordered]@{
              stagedRollout = [ordered]@{
                percentage = 100
              }
              rollback = [ordered]@{
                blockedVersions = @()
              }
            }
          }
          $releaseNotes | ConvertTo-Json -Depth 20 | Set-Content -Path "release-notes.json" -Encoding UTF8

          $updatesBaseUrl = "${{ env.UPDATES_BASE_URL }}".TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($updatesBaseUrl)) {
            $updatesBaseUrl = "https://updates.assistantx.pl"
          }
          # Use the download proxy so private GitHub release assets don't redirect
          # unauthenticated users to GitHub login. The proxy at assistantx.pl
          # authenticates server-side using GITHUB_TOKEN.
          $downloadProxyBase = "https://assistantx.pl/api/jarvis/download?tag=$releaseTag"

          $versionsManifest = [ordered]@{
            schema = "assistantx-updates-manifest"
            schemaVersion = 1
            generatedAt = $publishedAt
            channels = [ordered]@{
              stable = [ordered]@{
                windows = [ordered]@{
                  version = $version
                  latestVersion = $version
                  path = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                  url = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                  releaseNotes = ($highlights -join " ")
                  publishedAt = $publishedAt
                  artifacts = [ordered]@{
                    x64 = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                    arm64 = "$downloadProxyBase&file=JarvisSetup-arm64.exe"
                  }
                  desktop = [ordered]@{
                    feedUrl = "$updatesBaseUrl/windows"
                    releaseNotesUrl = "$updatesBaseUrl/windows/release-notes.json"
                  }
                }
                mac = [ordered]@{
                  version = $version
                  latestVersion = $version
                  path = "$downloadProxyBase&file=JarvisSetup-x64.dmg"
                  url = "$downloadProxyBase&file=JarvisSetup-x64.dmg"
                  releaseNotes = ($highlights -join " ")
                  publishedAt = $publishedAt
                  artifacts = [ordered]@{
                    x64 = "$downloadProxyBase&file=JarvisSetup-x64.dmg"
                    arm64 = "$downloadProxyBase&file=JarvisSetup-arm64.dmg"
                  }
                  desktop = [ordered]@{
                    feedUrl = "$updatesBaseUrl/mac"
                    releaseNotesUrl = "$updatesBaseUrl/mac/release-notes.json"
                  }
                }
                linux = [ordered]@{
                  version = $version
                  latestVersion = $version
                  path = "$downloadProxyBase&file=Jarvis-x64.AppImage"
                  url = "$downloadProxyBase&file=Jarvis-x64.AppImage"
                  releaseNotes = ($highlights -join " ")
                  publishedAt = $publishedAt
                  artifacts = [ordered]@{
                    x64 = "$downloadProxyBase&file=Jarvis-x64.AppImage"
                  }
                  desktop = [ordered]@{
                    feedUrl = "$updatesBaseUrl/linux"
                    releaseNotesUrl = "$updatesBaseUrl/linux/release-notes.json"
                  }
                }
                android = [ordered]@{
                  version = $version
                  latestVersion = $version
                  path = "$downloadProxyBase&file=Jarvis-android.apk"
                  url = "$downloadProxyBase&file=Jarvis-android.apk"
                  releaseNotes = ($highlights -join " ")
                  publishedAt = $publishedAt
                  artifacts = [ordered]@{
                    apk = "$downloadProxyBase&file=Jarvis-android.apk"
                  }
                }
              }
              beta = [ordered]@{
                windows = [ordered]@{
                  version = "${version}-beta.1"
                  latestVersion = "${version}-beta.1"
                  path = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                  url = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                  releaseNotes = "Beta channel build."
                  publishedAt = $publishedAt
                  artifacts = [ordered]@{
                    x64 = "$downloadProxyBase&file=JarvisSetup-x64.exe"
                    arm64 = "$downloadProxyBase&file=JarvisSetup-arm64.exe"
                  }
                  desktop = [ordered]@{
                    feedUrl = "$updatesBaseUrl/beta/windows"
                    releaseNotesUrl = "$updatesBaseUrl/beta/windows/release-notes.json"
                  }
                }
              }
            }
          }
          $versionsManifest | ConvertTo-Json -Depth 20 | Set-Content -Path "versions.json" -Encoding UTF8

          $body = @(
            "## What's new in v$version",
            "",
            "$notesMarkdown",
            "",
            "---",
            "Built from commit: [$sha7]($commitUrl)",
            "Built on: $date",
            "",
            "| File | Architecture |",
            "|------|-------------|",
            "| ${bt}JarvisSetup-x64.exe${bt} | Intel / AMD 64-bit |",
            "| ${bt}JarvisSetup-arm64.exe${bt} | ARM64 (Snapdragon, Surface Pro X) |",
            "| ${bt}JarvisSetup-x64.dmg${bt} | macOS Intel |",
            "| ${bt}JarvisSetup-arm64.dmg${bt} | macOS Apple Silicon |",
            "| ${bt}Jarvis-x64.AppImage${bt} | Linux x64 |",
            "| ${bt}Jarvis-android.apk${bt} | Android |",
            "",
            "**How to use:**",
            "1. Download the installer for your architecture.",
            "2. Run it — Windows may warn about an unsigned binary; click *More info → Run anyway*.",
            "3. Jarvis will start and connect to your AssistantX backend automatically.",
            "",
             "**Release validation checklist:**",
             "- [ ] Repo baseline (`npm run lint`, `npm test -- --runInBand`, `npm run build`)",
              "- [ ] Desktop smoke (`jarvis/desktop`: `npm ci`, `npm run dev`)",
              "- [ ] Packaged smoke (startup/tray, launcher, account, updater flow)",
              "- [ ] Workflow output verification (`JarvisSetup-x64.exe`, `JarvisSetup-arm64.exe`, `JarvisSetup-x64.dmg`, `JarvisSetup-arm64.dmg`, `Jarvis-x64.AppImage`, `latest.yml`, `latest.yml.sig`, `release-notes.json`, `*.blockmap`)",
              "- [ ] GitHub Release asset verification (`${{ env.RELEASE_TAG }}` includes updater metadata + installers)",
              "- [ ] Pre-existing/unrelated failures documented (if any)"
            ) -join "`n"

          $body | Set-Content -Path "changelog_body.txt" -Encoding UTF8
          Write-Host "Changelog written to changelog_body.txt"
          Write-Host "Release notes written to release-notes.json"
          Write-Host "Update manifest written to versions.json"

          # Expose version as a step output so other steps can reference it
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jarvis/desktop/package-lock.json

      - name: Set up Java for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install desktop dependencies
        working-directory: jarvis/desktop
        run: npm ci

      - name: Provision updater metadata verification key
        shell: pwsh
        env:
          UPDATE_FEED_METADATA_PUBLIC_KEY: ${{ secrets.UPDATE_FEED_METADATA_PUBLIC_KEY }}
          UPDATE_FEED_METADATA_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_METADATA_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PUBLIC_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PUBLIC_KEY"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PRIVATE_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PRIVATE_KEY"
            exit 1
          }

          $publicKeyPath = Join-Path (Get-Location) "jarvis/desktop/electron/updater/feed-public-key.pem"
          New-Item -ItemType Directory -Force -Path (Split-Path $publicKeyPath -Parent) | Out-Null
          $scriptPath = Join-Path $env:RUNNER_TEMP "export-updater-public-key.js"
          @'
          const fs = require("fs");
          const { exportPublicKeyPem } = require(require("path").join(process.cwd(), "jarvis/desktop/electron/updater/feed-metadata"));

          fs.writeFileSync(process.argv[2], exportPublicKeyPem(process.env.UPDATE_FEED_METADATA_PUBLIC_KEY), "utf8");
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          node $scriptPath $publicKeyPath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to normalize updater metadata public key."
            exit 1
          }
          Write-Host "Bundled updater metadata verification key at $publicKeyPath"

      - name: Validate desktop updater topology (manifest-only generic)
        shell: pwsh
        run: |
          $pkgPath = "jarvis/desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          if (-not $pkg.build -or -not $pkg.build.publish) {
            Write-Error "Missing jarvis/desktop build.publish configuration."
            exit 1
          }

          $publishEntries = @($pkg.build.publish)
          if ($publishEntries.Count -ne 1) {
            Write-Error "Expected exactly one publish entry for desktop updater."
            exit 1
          }

          $publish = $publishEntries[0]
          $actualProvider = [string]$publish.provider
          $actualUrl = [string]$publish.url
          $actualChannel = [string]$publish.channel

          if ($actualProvider -ne "generic") {
            Write-Error "Updater provider must be 'generic'. Found '$actualProvider'."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($actualUrl) -or $actualUrl -ne "https://updates.assistantx.pl/windows/") {
            Write-Error "Updater URL mismatch. Expected 'https://updates.assistantx.pl/windows/', got '$actualUrl'."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($actualChannel) -or $actualChannel -ne "latest") {
            Write-Error "Updater channel mismatch. Expected 'latest', got '$actualChannel'."
            exit 1
          }

          Write-Host "Desktop publish config validated: generic provider => $actualUrl (channel: $actualChannel)"

      - name: Download Windows Python embeddable runtime
        shell: pwsh
        run: |
          $pythonVersion = "3.11.9"
          $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "python-embed-amd64.zip"
          $extractPath = "jarvis/desktop/python"
          Write-Host "Downloading Python $pythonVersion embeddable runtime..."
          Invoke-WebRequest -Uri $pythonUrl -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting to $extractPath..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Write-Host "Python embeddable runtime ready at $extractPath"
          Get-ChildItem $extractPath | Select-Object -First 10

      - name: Build installers (x64 + ARM64)
        working-directory: jarvis/desktop
        run: npm run dist:win:all
        env:
          # electron-builder can sign the app if a certificate is available.
          # Leave blank to produce unsigned builds.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Embedded Python runtime smoke
        working-directory: jarvis/desktop
        run: npm run smoke:runtime

      - name: Attach release-notes.json to desktop dist
        shell: pwsh
        run: |
          $src = Join-Path (Get-Location) "release-notes.json"
          $dst = Join-Path (Get-Location) "jarvis/desktop/dist/release-notes.json"
          if (-not (Test-Path $src)) {
            Write-Error "Missing release-notes.json generated in meta step."
            exit 1
          }
          Copy-Item $src $dst -Force
          Write-Host "Copied release notes to $dst"

      - name: Validate versions.json manifest schema
        shell: pwsh
        run: |
          $manifestPath = Join-Path (Get-Location) "versions.json"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "Missing versions.json generated in meta step."
            exit 1
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.schemaVersion) {
            Write-Error "versions.json missing schemaVersion"
            exit 1
          }
          if (-not $manifest.channels -or -not $manifest.channels.stable -or -not $manifest.channels.beta) {
            Write-Error "versions.json missing stable/beta channels"
            exit 1
          }
          foreach ($platform in @("windows","mac","linux","android")) {
            if (-not $manifest.channels.stable.$platform) {
              Write-Error "versions.json stable channel missing platform: $platform"
              exit 1
            }
          }
          Write-Host "versions.json schema validated."

      - name: Packaged installer smoke
        working-directory: jarvis/desktop
        run: npm run smoke:installer

      - name: List dist directory
        working-directory: jarvis/desktop
        run: dir dist

      - name: Harden updater metadata (rollback, rollout, signature)
        shell: pwsh
        working-directory: jarvis/desktop
        env:
          UPDATE_FEED_METADATA_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_METADATA_PRIVATE_KEY }}
        run: |
          $expectedVersion = "${{ steps.meta.outputs.version }}"
          $minimumAllowedVersion = if ([string]::IsNullOrWhiteSpace($env:UPDATE_MINIMUM_ALLOWED_VERSION)) { $expectedVersion } else { $env:UPDATE_MINIMUM_ALLOWED_VERSION }
          $stagingPercentage = if ([string]::IsNullOrWhiteSpace($env:UPDATE_ROLLOUT_PERCENTAGE)) { "100" } else { $env:UPDATE_ROLLOUT_PERCENTAGE }
          $latestPath = Join-Path (Get-Location) "dist/latest.yml"
          if (-not (Test-Path $latestPath)) {
            Write-Error "Missing updater metadata: $latestPath"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PRIVATE_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PRIVATE_KEY"
            exit 1
          }

          $latestRaw = Get-Content $latestPath -Raw
          $latestRaw = $latestRaw.TrimEnd("`r", "`n")
          $metadataLines = @(
            $latestRaw,
            "minimumAllowedVersion: $minimumAllowedVersion",
            "stagingPercentage: $stagingPercentage"
          )
          ($metadataLines -join "`n") + "`n" | Set-Content -Path $latestPath -Encoding UTF8

          $tempDir = Join-Path $env:RUNNER_TEMP "jarvis-feed-signing"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $signaturePath = Join-Path (Get-Location) "dist/latest.yml.sig"

          $scriptPath = Join-Path $tempDir "sign-latest-yml.js"
          @'
          const fs = require("fs");
          const { signDetachedMetadata } = require(require("path").join(process.cwd(), "electron/updater/feed-metadata"));

          const latestPath = process.argv[2];
          const signaturePath = process.argv[3];

          const payload = fs.readFileSync(latestPath, "utf8");
          const signature = signDetachedMetadata({
            payload,
            privateKey: process.env.UPDATE_FEED_METADATA_PRIVATE_KEY,
          });
          fs.writeFileSync(signaturePath, `${signature}\n`, "utf8");
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          node $scriptPath $latestPath $signaturePath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to generate detached updater metadata signature."
            exit 1
          }

          Write-Host "Updater metadata hardened with minimumAllowedVersion=$minimumAllowedVersion stagingPercentage=$stagingPercentage"

      - name: Validate updater metadata and referenced artifacts
        shell: pwsh
        working-directory: jarvis/desktop
        env:
          UPDATE_FEED_METADATA_PUBLIC_KEY: ${{ secrets.UPDATE_FEED_METADATA_PUBLIC_KEY }}
        run: |
          $expectedVersion = "${{ steps.meta.outputs.version }}"
          $semverRegex = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          $latestPath = Join-Path (Get-Location) "dist/latest.yml"
          $signaturePath = Join-Path (Get-Location) "dist/latest.yml.sig"
          if (-not (Test-Path $latestPath)) {
            Write-Error "Missing updater metadata: $latestPath"
            exit 1
          }
          if (-not (Test-Path $signaturePath)) {
            Write-Error "Missing updater metadata signature: $signaturePath"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PUBLIC_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PUBLIC_KEY"
            exit 1
          }

          $latestRaw = Get-Content $latestPath -Raw
          if ([string]::IsNullOrWhiteSpace($latestRaw)) {
            Write-Error "Unable to parse latest.yml"
            exit 1
          }

          $versionMatch = [regex]::Match($latestRaw, '(?m)^\s*version\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if (-not $versionMatch.Success) {
            Write-Error "latest.yml is missing version."
            exit 1
          }
          $latestVersion = $versionMatch.Groups['value'].Value.Trim()
          if ($latestVersion -notmatch $semverRegex) {
            Write-Error "latest.yml version is not valid semver: $latestVersion"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($expectedVersion) -or $latestVersion -ne $expectedVersion) {
            Write-Error "latest.yml version mismatch. Expected $expectedVersion, got $latestVersion"
            exit 1
          }

          $channelMatch = [regex]::Match($latestRaw, '(?m)^\s*channel\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if ($channelMatch.Success) {
            $channel = $channelMatch.Groups['value'].Value.Trim().ToLowerInvariant()
            if ($channel -ne 'latest' -and $channel -ne 'stable') {
              Write-Error "Stable feed must not publish non-stable channel metadata. Found channel: $channel"
              exit 1
            }
          }

          if ($latestVersion.Contains('-')) {
            Write-Error "Stable feed must not publish prerelease versions. Found: $latestVersion"
            exit 1
          }

          $minimumMatch = [regex]::Match($latestRaw, '(?m)^\s*minimumAllowedVersion\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if (-not $minimumMatch.Success) {
            Write-Error "latest.yml is missing minimumAllowedVersion."
            exit 1
          }
          $minimumAllowedVersion = $minimumMatch.Groups['value'].Value.Trim()
          if ($minimumAllowedVersion -notmatch $semverRegex) {
            Write-Error "minimumAllowedVersion is not valid semver: $minimumAllowedVersion"
            exit 1
          }

          $rolloutMatch = [regex]::Match($latestRaw, '(?m)^\s*stagingPercentage\s*:\s*["'']?(?<value>\d{1,3})["'']?\s*$')
          if (-not $rolloutMatch.Success) {
            Write-Error "latest.yml is missing stagingPercentage."
            exit 1
          }
          $rolloutPercentage = [int]$rolloutMatch.Groups['value'].Value
          if ($rolloutPercentage -lt 0 -or $rolloutPercentage -gt 100) {
            Write-Error "stagingPercentage must be between 0 and 100. Found: $rolloutPercentage"
            exit 1
          }

          $candidateFiles = @()
          $pathMatches = [regex]::Matches($latestRaw, '(?m)^\s*path:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          foreach ($match in $pathMatches) {
            $value = $match.Groups['value'].Value.Trim()
            if ($value) { $candidateFiles += $value }
          }

          $urlMatches = [regex]::Matches($latestRaw, '(?m)^\s*url:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          foreach ($match in $urlMatches) {
            $value = $match.Groups['value'].Value.Trim()
            if ($value) { $candidateFiles += $value }
          }

          if ($candidateFiles.Count -eq 0) {
            Write-Error "latest.yml does not contain path/files entries."
            exit 1
          }

          foreach ($candidate in ($candidateFiles | Select-Object -Unique)) {
            $artifactPath = Join-Path (Join-Path (Get-Location) "dist") $candidate
            if (-not (Test-Path $artifactPath)) {
              Write-Error "latest.yml references missing artifact: $candidate"
              exit 1
            }
            Write-Host "Verified updater artifact: $candidate"
          }

          $releaseNotesPath = Join-Path (Join-Path (Get-Location) "dist") "release-notes.json"
          if (-not (Test-Path $releaseNotesPath)) {
            Write-Error "Missing dist/release-notes.json"
            exit 1
          }
          $releaseNotesRaw = Get-Content $releaseNotesPath -Raw
          $releaseNotes = $releaseNotesRaw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$releaseNotes.version)) {
            Write-Error "release-notes.json is missing version"
            exit 1
          }
          if (-not $releaseNotes.highlights -or @($releaseNotes.highlights).Count -eq 0) {
            Write-Error "release-notes.json must include at least one highlight"
            exit 1
          }
          Write-Host "Verified release-notes.json"

      - name: Upload x64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-x64
          path: jarvis/desktop/dist/JarvisSetup-x64.exe
          if-no-files-found: warn

      - name: Upload arm64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-arm64
          path: jarvis/desktop/dist/JarvisSetup-arm64.exe
          if-no-files-found: warn

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisUpdaterMetadata
          path: |
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/release-notes.json
            versions.json
            jarvis/desktop/dist/*.blockmap
          if-no-files-found: warn

      - name: Install Android dependencies
        working-directory: jarvis/android
        run: npm ci

      - name: Build/find Android APK
        id: android_apk
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          $distDir = Join-Path $repoRoot "jarvis/android/dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $apkOutput = Join-Path $distDir "Jarvis-android.apk"
          $found = $false
          $gradleBuildFailed = $false
          $lastGradleLines = ""
          $gradleLogPath = Join-Path $distDir "gradle-build.log"
          $gradleProjectDir = Join-Path $repoRoot "jarvis/android/android"
          $gradleWrapperPath = Join-Path $gradleProjectDir "gradlew.bat"
          $maxGradleTailLines = 50

          if (Test-Path $gradleWrapperPath) {
            Push-Location $gradleProjectDir
            try {
              & .\gradlew.bat assembleRelease *> $gradleLogPath
              if ($LASTEXITCODE -ne 0) {
                $gradleBuildFailed = $true
                if (Test-Path $gradleLogPath) {
                  $lastGradleLines = (Get-Content $gradleLogPath -Tail $maxGradleTailLines | Out-String).Trim()
                } else {
                  $lastGradleLines = "Gradle log file was not created at $gradleLogPath; verify wrapper execution and output redirection."
                }
                if ([string]::IsNullOrWhiteSpace($lastGradleLines)) {
                  $lastGradleLines = "No log lines captured; see uploaded gradle-build.log artifact."
                }
                Write-Warning "Android Gradle build failed with exit code $LASTEXITCODE; checking fallback APK locations. Last output:`n$lastGradleLines"
              }
            } finally {
              Pop-Location
            }
          } else {
            "Gradle wrapper not found at $gradleWrapperPath; skipped Android build." | Set-Content $gradleLogPath
          }

          # Search order:
          # 1) canonical Gradle output path from jarvis/android/android
          # 2) alternative Gradle output path for flatter Android projects
          # 3) prebuilt APK checked into jarvis/android with canonical filename
          # 4) prebuilt APK checked into jarvis/android with legacy filename
          # Items 3-4 are fallback inputs for repos/runners without Android build
          # toolchains or for manual emergency release drops.
          $candidates = @(
            # (1) Gradle output when project root is jarvis/android/android
            "jarvis/android/android/app/build/outputs/apk/release/app-release.apk",
            # (2) Gradle output for flatter project layout
            "jarvis/android/app/build/outputs/apk/release/app-release.apk",
            # (3) Canonical prebuilt APK filename
            "jarvis/android/Jarvis-android.apk",
            # (4) Legacy prebuilt APK filename
            "jarvis/android/JarvisAndroid.apk"
          )

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate $apkOutput -Force
              $found = $true
              break
            }
          }

          if ($found) {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "Android APK prepared at $apkOutput"
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            if ($gradleBuildFailed) {
              Write-Warning "No Android APK found after Gradle build failure. Last Gradle output:`n$lastGradleLines"
            }
            Write-Host "Android APK not found; skipping Android release asset."
          }

      - name: Upload Android installer artifact
        if: steps.android_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-android
          path: jarvis/android/dist/Jarvis-android.apk
          if-no-files-found: error

      - name: Upload Android Gradle log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-android-gradle-log
          path: jarvis/android/dist/gradle-build.log
          if-no-files-found: ignore

      - name: Publish to GitHub Release (${{ env.RELEASE_TAG }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Jarvis Desktop — v${{ steps.meta.outputs.version }}"
          body_path: changelog_body.txt
          prerelease: false
          make_latest: true
          files: |
            jarvis/desktop/dist/JarvisSetup-x64.exe
            jarvis/desktop/dist/JarvisSetup-arm64.exe
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/latest.yml.sig
            jarvis/desktop/dist/release-notes.json
            versions.json
            jarvis/desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish Android APK to GitHub Release (${{ env.RELEASE_TAG }})
        if: steps.android_apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            jarvis/android/dist/Jarvis-android.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release visibility and required assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            Write-Error "GITHUB_TOKEN is required to verify release visibility."
            exit 1
          }

          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseTag = "${{ env.RELEASE_TAG }}"
          $tagReleaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$releaseTag"
          $tagRelease = Invoke-RestMethod -Method Get -Headers $headers -Uri $tagReleaseUrl

          if ($tagRelease.draft -or $tagRelease.prerelease) {
            Write-Error "Release '$releaseTag' must be a published non-prerelease release."
            exit 1
          }

          $requiredAssets = @(
            "latest.yml",
            "latest.yml.sig",
            "release-notes.json",
            "versions.json",
            "JarvisSetup-x64.exe",
            "JarvisSetup-x64.exe.blockmap",
            "JarvisSetup-arm64.exe",
            "JarvisSetup-arm64.exe.blockmap"
          )

          $assetNames = @($tagRelease.assets | ForEach-Object { $_.name })
          foreach ($required in $requiredAssets) {
            if (-not ($assetNames -contains $required)) {
            Write-Error "Release '$releaseTag' is missing required asset: $required"
              exit 1
            }
            Write-Host "Verified release asset: $required"
          }

  build-mac:
    name: Build Jarvis DMG (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jarvis-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jarvis/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: jarvis/desktop
        run: npm ci

      - name: Build DMG installers (x64 + arm64)
        working-directory: jarvis/desktop
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS x64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-mac-x64
          path: jarvis/desktop/dist/JarvisSetup-x64.dmg
          if-no-files-found: warn

      - name: Upload macOS arm64 DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-mac-arm64
          path: jarvis/desktop/dist/JarvisSetup-arm64.dmg
          if-no-files-found: warn

      - name: Publish macOS DMGs to GitHub Release (${{ env.RELEASE_TAG }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            jarvis/desktop/dist/JarvisSetup-x64.dmg
            jarvis/desktop/dist/JarvisSetup-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-linux:
    name: Build Jarvis AppImage (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jarvis-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jarvis/desktop/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 libappindicator3-dev

      - name: Install desktop dependencies
        working-directory: jarvis/desktop
        run: npm ci

      - name: Build Linux AppImage (x64)
        working-directory: jarvis/desktop
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve Linux AppImage artifact path
        id: linux_appimage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(jarvis/desktop/dist/Jarvis*.AppImage)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Linux AppImage found in jarvis/desktop/dist"
            exit 0
          fi

          appimage_path="${candidates[0]}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=${appimage_path}" >> "$GITHUB_OUTPUT"
          echo "Resolved Linux AppImage: ${appimage_path}"

      - name: Upload Linux AppImage artifact
        if: steps.linux_appimage.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-linux-appimage-x64
          path: ${{ steps.linux_appimage.outputs.path }}
          if-no-files-found: warn

      - name: Publish Linux AppImage to GitHub Release (${{ env.RELEASE_TAG }})
        if: steps.linux_appimage.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.linux_appimage.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-android:
    name: Build Jarvis Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jarvis-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jarvis/android/package-lock.json

      - name: Set up Java for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            jarvis/android/android/**/*.gradle*
            jarvis/android/android/gradle.properties
            jarvis/android/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android JS dependencies
        working-directory: jarvis/android
        run: npm ci

      - name: Build Android release APK
        working-directory: jarvis/android/android
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Jarvis-android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-android
          path: jarvis/android/dist/Jarvis-android.apk
          if-no-files-found: error

      - name: Publish Android APK to GitHub Release (${{ env.RELEASE_TAG }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            jarvis/android/dist/Jarvis-android.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy-manifest-to-vercel:
    name: Deploy versions manifest to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - build
      - build-mac
      - build-linux
      - build-android
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/') && github.ref_name || 'jarvis-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Missing required secret: VERCEL_TOKEN" >&2
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "Missing required secret: VERCEL_ORG_ID" >&2
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "Missing required secret: VERCEL_PROJECT_ID" >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Generate versions.json for release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG}"
          if [[ "$release_tag" == "jarvis-latest" ]]; then
            # Read version from package.json for rolling build
            version="$(node -p "require('./jarvis/desktop/package.json').version")"
          elif [[ "$release_tag" =~ ^[vV]([0-9]+)(\.([0-9]+))?(\.([0-9]+))?([+-][0-9A-Za-z.-]+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[3]:-0}"
            patch="${BASH_REMATCH[5]:-0}"
            suffix="${BASH_REMATCH[6]:-}"
            version="${major}.${minor}.${patch}${suffix}"
          else
            echo "Invalid release tag: $release_tag (expected formats like v1.1.0, v2, V2, or jarvis-latest)" >&2
            exit 1
          fi
          base_url="https://assistantx.pl/api/jarvis/download?tag=${release_tag}"
          generated_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p public/updates
          cat > public/updates/versions.json <<EOF
          {
            "schema": "assistantx-updates-manifest",
            "schemaVersion": 1,
            "generatedAt": "${generated_at}",
            "channels": {
              "stable": {
                "windows": {
                  "version": "${version}",
                  "latestVersion": "${version}",
                  "path": "${base_url}&file=JarvisSetup-x64.exe",
                  "url": "${base_url}&file=JarvisSetup-x64.exe",
                  "artifacts": {
                    "x64": "${base_url}&file=JarvisSetup-x64.exe",
                    "arm64": "${base_url}&file=JarvisSetup-arm64.exe"
                  },
                  "desktop": {
                    "feedUrl": "https://updates.assistantx.pl/windows"
                  }
                },
                "linux": {
                  "version": "${version}",
                  "latestVersion": "${version}",
                  "path": "${base_url}&file=Jarvis-x64.AppImage",
                  "url": "${base_url}&file=Jarvis-x64.AppImage",
                  "artifacts": {
                    "x64": "${base_url}&file=Jarvis-x64.AppImage"
                  },
                  "desktop": {
                    "feedUrl": "https://updates.assistantx.pl/linux"
                  }
                },
                "mac": {
                  "version": "${version}",
                  "latestVersion": "${version}",
                  "path": "${base_url}&file=JarvisSetup-x64.dmg",
                  "url": "${base_url}&file=JarvisSetup-x64.dmg",
                  "artifacts": {
                    "x64": "${base_url}&file=JarvisSetup-x64.dmg",
                    "arm64": "${base_url}&file=JarvisSetup-arm64.dmg"
                  },
                  "desktop": {
                    "feedUrl": "https://updates.assistantx.pl/mac"
                  }
                },
                "android": {
                  "version": "${version}",
                  "latestVersion": "${version}",
                  "path": "${base_url}&file=Jarvis-android.apk",
                  "url": "${base_url}&file=Jarvis-android.apk",
                  "artifacts": {
                    "apk": "${base_url}&file=Jarvis-android.apk"
                  }
                }
              },
              "beta": {
                "windows": {
                  "version": "${version}-beta.1",
                  "latestVersion": "${version}-beta.1",
                  "path": "${base_url}&file=JarvisSetup-x64.exe",
                  "url": "${base_url}&file=JarvisSetup-x64.exe",
                  "artifacts": {
                    "x64": "${base_url}&file=JarvisSetup-x64.exe",
                    "arm64": "${base_url}&file=JarvisSetup-arm64.exe"
                  },
                  "desktop": {
                    "feedUrl": "https://updates.assistantx.pl/beta/windows"
                  }
                },
                "linux": {
                  "version": "${version}-beta.1",
                  "latestVersion": "${version}-beta.1",
                  "path": "${base_url}&file=Jarvis-x64.AppImage",
                  "url": "${base_url}&file=Jarvis-x64.AppImage",
                  "artifacts": {
                    "x64": "${base_url}&file=Jarvis-x64.AppImage"
                  },
                  "desktop": {
                    "feedUrl": "https://updates.assistantx.pl/beta/linux"
                  }
                }
              }
            }
          }
          EOF
          cp public/updates/versions.json public/versions.json

      - name: Deploy manifest to Vercel
        run: vercel --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
