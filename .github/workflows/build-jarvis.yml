name: Build Jarvis Desktop

on:
  # Trigger manually from the Actions tab
  workflow_dispatch:
  # Trigger automatically when the desktop source changes
  push:
    branches:
      - main
    paths:
      - 'jarvis/desktop/**'

jobs:
  build:
    name: Build Jarvis EXE (Windows)
    runs-on: windows-latest

    # Minimal permissions: read code + write releases
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPDATE_ROLLOUT_PERCENTAGE: '100'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can generate a meaningful changelog
          fetch-depth: 0

      - name: Bump version and generate changelog
        id: meta
        shell: pwsh
        run: |
          # Version: 0.1.{run_number} — guarantees electron-updater sees a newer build each time
          $version = "0.1.${{ github.run_number }}"
          Write-Host "Version: $version"

          # Patch desktop package.json
          $desktopPkg = Get-Content "jarvis/desktop/package.json" -Raw | ConvertFrom-Json
          $desktopPkg.version = $version
          $desktopPkg | ConvertTo-Json -Depth 20 | Set-Content "jarvis/desktop/package.json" -Encoding UTF8

          # Patch android package.json
          $androidPkg = Get-Content "jarvis/android/package.json" -Raw | ConvertFrom-Json
          $androidPkg.version = $version
          $androidPkg | ConvertTo-Json -Depth 20 | Set-Content "jarvis/android/package.json" -Encoding UTF8

          # Generate changelog highlights from the last 20 commits that touched the jarvis/ tree.
          # Redirect stderr to null so git error output never leaks into the release notes.
          $commitsRaw = git log --pretty=format:"%s" -20 -- jarvis/ 2>$null
          $commitLines = @($commitsRaw -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($commitLines.Count -eq 0) {
            $commitLines = @("Build updated")
          }
          $highlights = @($commitLines | Select-Object -First 8)
          $notesMarkdown = ($highlights | ForEach-Object { "- $_" }) -join "`n"

          $sha7 = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date -AsUTC -Format "yyyy-MM-dd HH:mm") + " UTC"
          $publishedAt = (Get-Date -AsUTC).ToString("o")

          $bt = '``'
          $commitUrl = "https://github.com/wiktorskrabel89-byte/Assistantx/commit/${{ github.sha }}"

          $releaseNotes = [ordered]@{
            version = $version
            channel = "stable"
            publishedAt = $publishedAt
            highlights = $highlights
            notesMarkdown = $notesMarkdown
            policy = [ordered]@{
              stagedRollout = [ordered]@{
                percentage = 100
              }
              rollback = [ordered]@{
                blockedVersions = @()
              }
            }
          }
          $releaseNotes | ConvertTo-Json -Depth 20 | Set-Content -Path "release-notes.json" -Encoding UTF8

          $body = @(
            "## What's new in v$version",
            "",
            "$notesMarkdown",
            "",
            "---",
            "Built from commit: [$sha7]($commitUrl)",
            "Built on: $date",
            "",
            "| File | Architecture |",
            "|------|-------------|",
            "| ${bt}JarvisSetup-x64.exe${bt} | Intel / AMD 64-bit |",
            "| ${bt}JarvisSetup-arm64.exe${bt} | ARM64 (Snapdragon, Surface Pro X) |",
            "| ${bt}Jarvis-android.apk${bt} | Android |",
            "",
            "**How to use:**",
            "1. Download the installer for your architecture.",
            "2. Run it — Windows may warn about an unsigned binary; click *More info → Run anyway*.",
            "3. Jarvis will start and connect to your AssistantX backend automatically.",
            "",
             "**Release validation checklist:**",
             "- [ ] Repo baseline (`npm run lint`, `npm test -- --runInBand`, `npm run build`)",
              "- [ ] Desktop smoke (`jarvis/desktop`: `npm ci`, `npm run dev`)",
              "- [ ] Packaged smoke (startup/tray, launcher, account, updater flow)",
              "- [ ] Workflow output verification (`JarvisSetup-x64.exe`, `JarvisSetup-arm64.exe`, `latest.yml`, `latest.yml.sig`, `release-notes.json`, `*.blockmap`)",
              "- [ ] GitHub Release asset verification (`jarvis-latest` includes updater metadata + installers)",
              "- [ ] Pre-existing/unrelated failures documented (if any)"
            ) -join "`n"

          $body | Set-Content -Path "changelog_body.txt" -Encoding UTF8
          Write-Host "Changelog written to changelog_body.txt"
          Write-Host "Release notes written to release-notes.json"

          # Expose version as a step output so other steps can reference it
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jarvis/desktop/package-lock.json

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install desktop dependencies
        working-directory: jarvis/desktop
        run: npm ci

      - name: Provision updater metadata verification key
        shell: pwsh
        env:
          UPDATE_FEED_METADATA_PUBLIC_KEY: ${{ secrets.UPDATE_FEED_METADATA_PUBLIC_KEY }}
          UPDATE_FEED_METADATA_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_METADATA_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PUBLIC_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PUBLIC_KEY"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PRIVATE_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PRIVATE_KEY"
            exit 1
          }

          $publicKeyPath = Join-Path (Get-Location) "jarvis/desktop/electron/updater/feed-public-key.pem"
          New-Item -ItemType Directory -Force -Path (Split-Path $publicKeyPath -Parent) | Out-Null
          $scriptPath = Join-Path $env:RUNNER_TEMP "export-updater-public-key.js"
          @'
          const fs = require("fs");
          const { exportPublicKeyPem } = require(require("path").join(process.cwd(), "jarvis/desktop/electron/updater/feed-metadata"));

          fs.writeFileSync(process.argv[2], exportPublicKeyPem(process.env.UPDATE_FEED_METADATA_PUBLIC_KEY), "utf8");
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          node $scriptPath $publicKeyPath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to normalize updater metadata public key."
            exit 1
          }
          Write-Host "Bundled updater metadata verification key at $publicKeyPath"

      - name: Validate desktop updater topology (GitHub Releases)
        shell: pwsh
        run: |
          $pkgPath = "jarvis/desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          if (-not $pkg.build -or -not $pkg.build.publish) {
            Write-Error "Missing jarvis/desktop build.publish configuration."
            exit 1
          }

          $publishEntries = @($pkg.build.publish)
          if ($publishEntries.Count -ne 1) {
            Write-Error "Expected exactly one publish entry for desktop updater."
            exit 1
          }

          $publish = $publishEntries[0]
          $expectedOwner = "${{ github.repository_owner }}"
          $expectedRepo = "${{ github.event.repository.name }}"
          $actualProvider = [string]$publish.provider
          $actualOwner = [string]$publish.owner
          $actualRepo = [string]$publish.repo

          if ($actualProvider -ne "github") {
            Write-Error "Updater provider must be 'github'. Found '$actualProvider'."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($actualOwner) -or $actualOwner -ne $expectedOwner) {
            Write-Error "Updater owner mismatch. Expected '$expectedOwner', got '$actualOwner'."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($actualRepo) -or $actualRepo -ne $expectedRepo) {
            Write-Error "Updater repo mismatch. Expected '$expectedRepo', got '$actualRepo'."
            exit 1
          }

          if ($publish.private -ne $false) {
            Write-Error "Updater publish config must declare 'private: false' for public GitHub release access."
            exit 1
          }

          Write-Host "Desktop publish config validated: GitHub provider => $actualOwner/$actualRepo (public)"

      - name: Build installers (x64 + ARM64)
        working-directory: jarvis/desktop
        run: npm run dist:win:all
        env:
          # electron-builder recognises GH_TOKEN for authenticated GitHub release publishing.
          # Use GH_TOKEN (not GITHUB_TOKEN) because GitHub Actions blocks custom secrets
          # in the GITHUB_ namespace.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # electron-builder can sign the app if a certificate is available.
          # Leave blank to produce unsigned builds.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Attach release-notes.json to desktop dist
        shell: pwsh
        run: |
          $src = Join-Path (Get-Location) "release-notes.json"
          $dst = Join-Path (Get-Location) "jarvis/desktop/dist/release-notes.json"
          if (-not (Test-Path $src)) {
            Write-Error "Missing release-notes.json generated in meta step."
            exit 1
          }
          Copy-Item $src $dst -Force
          Write-Host "Copied release notes to $dst"

      - name: List dist directory
        working-directory: jarvis/desktop
        run: dir dist

      - name: Harden updater metadata (rollback, rollout, signature)
        shell: pwsh
        working-directory: jarvis/desktop
        env:
          UPDATE_FEED_METADATA_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_METADATA_PRIVATE_KEY }}
        run: |
          $expectedVersion = "${{ steps.meta.outputs.version }}"
          $minimumAllowedVersion = if ([string]::IsNullOrWhiteSpace($env:UPDATE_MINIMUM_ALLOWED_VERSION)) { $expectedVersion } else { $env:UPDATE_MINIMUM_ALLOWED_VERSION }
          $stagingPercentage = if ([string]::IsNullOrWhiteSpace($env:UPDATE_ROLLOUT_PERCENTAGE)) { "100" } else { $env:UPDATE_ROLLOUT_PERCENTAGE }
          $latestPath = Join-Path (Get-Location) "dist/latest.yml"
          if (-not (Test-Path $latestPath)) {
            Write-Error "Missing updater metadata: $latestPath"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PRIVATE_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PRIVATE_KEY"
            exit 1
          }

          $latestRaw = Get-Content $latestPath -Raw
          $latestRaw = $latestRaw.TrimEnd("`r", "`n")
          $metadataLines = @(
            $latestRaw,
            "minimumAllowedVersion: $minimumAllowedVersion",
            "stagingPercentage: $stagingPercentage"
          )
          ($metadataLines -join "`n") + "`n" | Set-Content -Path $latestPath -Encoding UTF8

          $tempDir = Join-Path $env:RUNNER_TEMP "jarvis-feed-signing"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $signaturePath = Join-Path (Get-Location) "dist/latest.yml.sig"

          $scriptPath = Join-Path $tempDir "sign-latest-yml.js"
          @'
          const fs = require("fs");
          const { signDetachedMetadata } = require(require("path").join(process.cwd(), "electron/updater/feed-metadata"));

          const latestPath = process.argv[2];
          const signaturePath = process.argv[3];

          const payload = fs.readFileSync(latestPath, "utf8");
          const signature = signDetachedMetadata({
            payload,
            privateKey: process.env.UPDATE_FEED_METADATA_PRIVATE_KEY,
          });
          fs.writeFileSync(signaturePath, `${signature}\n`, "utf8");
          '@ | Set-Content -Path $scriptPath -Encoding UTF8

          node $scriptPath $latestPath $signaturePath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to generate detached updater metadata signature."
            exit 1
          }

          Write-Host "Updater metadata hardened with minimumAllowedVersion=$minimumAllowedVersion stagingPercentage=$stagingPercentage"

      - name: Validate updater metadata and referenced artifacts
        shell: pwsh
        working-directory: jarvis/desktop
        env:
          UPDATE_FEED_METADATA_PUBLIC_KEY: ${{ secrets.UPDATE_FEED_METADATA_PUBLIC_KEY }}
        run: |
          $expectedVersion = "${{ steps.meta.outputs.version }}"
          $semverRegex = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          $latestPath = Join-Path (Get-Location) "dist/latest.yml"
          $signaturePath = Join-Path (Get-Location) "dist/latest.yml.sig"
          if (-not (Test-Path $latestPath)) {
            Write-Error "Missing updater metadata: $latestPath"
            exit 1
          }
          if (-not (Test-Path $signaturePath)) {
            Write-Error "Missing updater metadata signature: $signaturePath"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_FEED_METADATA_PUBLIC_KEY)) {
            Write-Error "Missing required secret: UPDATE_FEED_METADATA_PUBLIC_KEY"
            exit 1
          }

          $latestRaw = Get-Content $latestPath -Raw
          if ([string]::IsNullOrWhiteSpace($latestRaw)) {
            Write-Error "Unable to parse latest.yml"
            exit 1
          }

          $versionMatch = [regex]::Match($latestRaw, '(?m)^\s*version\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if (-not $versionMatch.Success) {
            Write-Error "latest.yml is missing version."
            exit 1
          }
          $latestVersion = $versionMatch.Groups['value'].Value.Trim()
          if ($latestVersion -notmatch $semverRegex) {
            Write-Error "latest.yml version is not valid semver: $latestVersion"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($expectedVersion) -or $latestVersion -ne $expectedVersion) {
            Write-Error "latest.yml version mismatch. Expected $expectedVersion, got $latestVersion"
            exit 1
          }

          $channelMatch = [regex]::Match($latestRaw, '(?m)^\s*channel\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if ($channelMatch.Success) {
            $channel = $channelMatch.Groups['value'].Value.Trim().ToLowerInvariant()
            if ($channel -ne 'latest' -and $channel -ne 'stable') {
              Write-Error "Stable feed must not publish non-stable channel metadata. Found channel: $channel"
              exit 1
            }
          }

          if ($latestVersion.Contains('-')) {
            Write-Error "Stable feed must not publish prerelease versions. Found: $latestVersion"
            exit 1
          }

          $minimumMatch = [regex]::Match($latestRaw, '(?m)^\s*minimumAllowedVersion\s*:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          if (-not $minimumMatch.Success) {
            Write-Error "latest.yml is missing minimumAllowedVersion."
            exit 1
          }
          $minimumAllowedVersion = $minimumMatch.Groups['value'].Value.Trim()
          if ($minimumAllowedVersion -notmatch $semverRegex) {
            Write-Error "minimumAllowedVersion is not valid semver: $minimumAllowedVersion"
            exit 1
          }

          $rolloutMatch = [regex]::Match($latestRaw, '(?m)^\s*stagingPercentage\s*:\s*["'']?(?<value>\d{1,3})["'']?\s*$')
          if (-not $rolloutMatch.Success) {
            Write-Error "latest.yml is missing stagingPercentage."
            exit 1
          }
          $rolloutPercentage = [int]$rolloutMatch.Groups['value'].Value
          if ($rolloutPercentage -lt 0 -or $rolloutPercentage -gt 100) {
            Write-Error "stagingPercentage must be between 0 and 100. Found: $rolloutPercentage"
            exit 1
          }

          $candidateFiles = @()
          $pathMatches = [regex]::Matches($latestRaw, '(?m)^\s*path:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          foreach ($match in $pathMatches) {
            $value = $match.Groups['value'].Value.Trim()
            if ($value) { $candidateFiles += $value }
          }

          $urlMatches = [regex]::Matches($latestRaw, '(?m)^\s*url:\s*["'']?(?<value>[^"''\r\n#]+)["'']?\s*$')
          foreach ($match in $urlMatches) {
            $value = $match.Groups['value'].Value.Trim()
            if ($value) { $candidateFiles += $value }
          }

          if ($candidateFiles.Count -eq 0) {
            Write-Error "latest.yml does not contain path/files entries."
            exit 1
          }

          foreach ($candidate in ($candidateFiles | Select-Object -Unique)) {
            $artifactPath = Join-Path (Join-Path (Get-Location) "dist") $candidate
            if (-not (Test-Path $artifactPath)) {
              Write-Error "latest.yml references missing artifact: $candidate"
              exit 1
            }
            Write-Host "Verified updater artifact: $candidate"
          }

          $releaseNotesPath = Join-Path (Join-Path (Get-Location) "dist") "release-notes.json"
          if (-not (Test-Path $releaseNotesPath)) {
            Write-Error "Missing dist/release-notes.json"
            exit 1
          }
          $releaseNotesRaw = Get-Content $releaseNotesPath -Raw
          $releaseNotes = $releaseNotesRaw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$releaseNotes.version)) {
            Write-Error "release-notes.json is missing version"
            exit 1
          }
          if (-not $releaseNotes.highlights -or @($releaseNotes.highlights).Count -eq 0) {
            Write-Error "release-notes.json must include at least one highlight"
            exit 1
          }
          Write-Host "Verified release-notes.json"

      - name: Upload x64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-x64
          path: jarvis/desktop/dist/JarvisSetup-x64.exe
          if-no-files-found: warn

      - name: Upload arm64 installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisSetup-arm64
          path: jarvis/desktop/dist/JarvisSetup-arm64.exe
          if-no-files-found: warn

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: JarvisUpdaterMetadata
          path: |
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/release-notes.json
            jarvis/desktop/dist/*.blockmap
          if-no-files-found: warn

      - name: Build/find Android APK
        id: android_apk
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          $distDir = Join-Path $repoRoot "jarvis/android/dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $apkOutput = Join-Path $distDir "Jarvis-android.apk"
          $found = $false
          $gradleBuildFailed = $false
          $lastGradleLines = ""
          $gradleLogPath = Join-Path $distDir "gradle-build.log"
          $gradleProjectDir = Join-Path $repoRoot "jarvis/android/android"
          $gradleWrapperPath = Join-Path $gradleProjectDir "gradlew.bat"
          $maxGradleTailLines = 50

          if (Test-Path $gradleWrapperPath) {
            Push-Location $gradleProjectDir
            try {
              & .\gradlew.bat assembleRelease *> $gradleLogPath
              if ($LASTEXITCODE -ne 0) {
                $gradleBuildFailed = $true
                if (Test-Path $gradleLogPath) {
                  $lastGradleLines = (Get-Content $gradleLogPath -Tail $maxGradleTailLines | Out-String).Trim()
                } else {
                  $lastGradleLines = "Gradle log file was not created at $gradleLogPath; verify wrapper execution and output redirection."
                }
                if ([string]::IsNullOrWhiteSpace($lastGradleLines)) {
                  $lastGradleLines = "No log lines captured; see uploaded gradle-build.log artifact."
                }
                Write-Warning "Android Gradle build failed with exit code $LASTEXITCODE; checking fallback APK locations. Last output:`n$lastGradleLines"
              }
            } finally {
              Pop-Location
            }
          } else {
            "Gradle wrapper not found at $gradleWrapperPath; skipped Android build." | Set-Content $gradleLogPath
          }

          # Search order:
          # 1) canonical Gradle output path from jarvis/android/android
          # 2) alternative Gradle output path for flatter Android projects
          # 3) prebuilt APK checked into jarvis/android with canonical filename
          # 4) prebuilt APK checked into jarvis/android with legacy filename
          # Items 3-4 are fallback inputs for repos/runners without Android build
          # toolchains or for manual emergency release drops.
          $candidates = @(
            # (1) Gradle output when project root is jarvis/android/android
            "jarvis/android/android/app/build/outputs/apk/release/app-release.apk",
            # (2) Gradle output for flatter project layout
            "jarvis/android/app/build/outputs/apk/release/app-release.apk",
            # (3) Canonical prebuilt APK filename
            "jarvis/android/Jarvis-android.apk",
            # (4) Legacy prebuilt APK filename
            "jarvis/android/JarvisAndroid.apk"
          )

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate $apkOutput -Force
              $found = $true
              break
            }
          }

          if ($found) {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "Android APK prepared at $apkOutput"
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            if ($gradleBuildFailed) {
              Write-Error "No Android APK found after Gradle build failure. Last Gradle output:`n$lastGradleLines"
              exit 1
            }
            Write-Host "Android APK not found; skipping Android release asset."
          }

      - name: Upload Android installer artifact
        if: steps.android_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-android
          path: jarvis/android/dist/Jarvis-android.apk
          if-no-files-found: error

      - name: Upload Android Gradle log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-android-gradle-log
          path: jarvis/android/dist/gradle-build.log
          if-no-files-found: ignore

      - name: Publish to GitHub Release (jarvis-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: "Jarvis Desktop — v${{ steps.meta.outputs.version }}"
          body_path: changelog_body.txt
          prerelease: false
          make_latest: true
          files: |
            jarvis/desktop/dist/JarvisSetup-x64.exe
            jarvis/desktop/dist/JarvisSetup-arm64.exe
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/latest.yml.sig
            jarvis/desktop/dist/release-notes.json
            jarvis/desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android APK to GitHub Release (jarvis-latest)
        if: steps.android_apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          files: |
            jarvis/android/dist/Jarvis-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify jarvis-latest release visibility and required assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            Write-Error "GITHUB_TOKEN is required to verify release visibility."
            exit 1
          }

          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $tagReleaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/jarvis-latest"
          $latestReleaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/latest"
          $tagRelease = Invoke-RestMethod -Method Get -Headers $headers -Uri $tagReleaseUrl
          $latestRelease = Invoke-RestMethod -Method Get -Headers $headers -Uri $latestReleaseUrl

          if ($tagRelease.draft -or $tagRelease.prerelease) {
            Write-Error "jarvis-latest must be a published non-prerelease release."
            exit 1
          }

          if ($latestRelease.tag_name -ne "jarvis-latest") {
            Write-Error "Latest GitHub release tag mismatch. Expected jarvis-latest, got $($latestRelease.tag_name)."
            exit 1
          }

          $requiredAssets = @(
            "latest.yml",
            "latest.yml.sig",
            "release-notes.json",
            "JarvisSetup-x64.exe",
            "JarvisSetup-x64.exe.blockmap",
            "JarvisSetup-arm64.exe",
            "JarvisSetup-arm64.exe.blockmap"
          )

          $assetNames = @($tagRelease.assets | ForEach-Object { $_.name })
          foreach ($required in $requiredAssets) {
            if (-not ($assetNames -contains $required)) {
              Write-Error "jarvis-latest is missing required asset: $required"
              exit 1
            }
            Write-Host "Verified release asset: $required"
          }
