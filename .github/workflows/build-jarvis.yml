name: Build Jarvis Desktop

on:
  # Trigger manually from the Actions tab
  workflow_dispatch:
  # Trigger automatically when the desktop source changes
  push:
    branches:
      - main
    paths:
      - 'jarvis/desktop/**'

jobs:
  build:
    name: Build Jarvis EXE (Windows)
    runs-on: windows-latest

    # Minimal permissions: read code + write releases
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jarvis/desktop/package-lock.json

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install desktop dependencies
        working-directory: jarvis/desktop
        run: npm install

      - name: Build installers (x64 + ARM64)
        working-directory: jarvis/desktop
        run: npm run dist:win:all
        env:
          # electron-builder can sign the app if a certificate is available.
          # Leave blank to produce unsigned builds.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || '' }}

      - name: List dist directory
        working-directory: jarvis/desktop
        run: dir dist

      - name: Upload x64 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup-x64
          path: jarvis/desktop/dist/JarvisSetup-x64.exe
          if-no-files-found: warn

      - name: Upload arm64 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup-arm64
          path: jarvis/desktop/dist/JarvisSetup-arm64.exe
          if-no-files-found: warn

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisUpdaterMetadata
          path: |
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/*.blockmap
          if-no-files-found: warn

      - name: Build/find Android APK
        id: android_apk
        shell: pwsh
        run: |
          $distDir = "jarvis/android/dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $apkOutput = Join-Path $distDir "Jarvis-android.apk"
          $found = $false
          $gradleBuildFailed = $false

          if (Test-Path "jarvis/android/android/gradlew.bat") {
            Push-Location "jarvis/android/android"
            try {
              ./gradlew.bat assembleRelease
              if ($LASTEXITCODE -ne 0) {
                $gradleBuildFailed = $true
                Write-Warning "Android Gradle build failed with exit code $LASTEXITCODE; checking fallback APK locations."
              }
            } finally {
              Pop-Location
            }
          }

          # Check canonical Gradle outputs first, then fallback to prebuilt APK names.
          $candidates = @(
            "jarvis/android/android/app/build/outputs/apk/release/app-release.apk",
            "jarvis/android/app/build/outputs/apk/release/app-release.apk",
            "jarvis/android/Jarvis-android.apk",
            "jarvis/android/JarvisAndroid.apk"
          )

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Copy-Item $candidate $apkOutput -Force
              $found = $true
              break
            }
          }

          if ($found) {
            "found=true" >> $env:GITHUB_OUTPUT
            Write-Host "Android APK prepared at $apkOutput"
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            if ($gradleBuildFailed) {
              Write-Warning "No Android APK found after Gradle build failure."
            }
            Write-Host "Android APK not found; skipping Android release asset."
          }

      - name: Upload Android installer artifact
        if: steps.android_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-android
          path: jarvis/android/dist/Jarvis-android.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (jarvis-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis Desktop — latest build
          body: |
            Automatically built from `jarvis/desktop/` on commit ${{ github.sha }}.

            | File | Architecture |
            |------|-------------|
            | `JarvisSetup-x64.exe` | Intel / AMD 64-bit |
            | `JarvisSetup-arm64.exe` | ARM64 (Snapdragon, Surface Pro X) |
            | `Jarvis-android.apk` | Android |

            **How to use:**
            1. Download the installer for your architecture.
            2. Run it — Windows may warn about an unsigned binary; click *More info → Run anyway*.
            3. Jarvis will start and connect to your AssistantX backend automatically.
          prerelease: false
          make_latest: true
          files: |
            jarvis/desktop/dist/JarvisSetup-x64.exe
            jarvis/desktop/dist/JarvisSetup-arm64.exe
            jarvis/desktop/dist/latest.yml
            jarvis/desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android APK to GitHub Release (jarvis-latest)
        if: steps.android_apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          files: |
            jarvis/android/dist/Jarvis-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
